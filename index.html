  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F2F2F7; min-height: 100vh; color: #000; }

<script>

// The Supabase library comes from a CDN. Reading it at load time would kill the
// whole script if that request failed, leaving a splash screen spinning forever,
// so it is resolved in init() where the failure can be reported.
let db = null;

// ── STATE ────────────────────────────────────────────────────
const DEFS = {
  roles: ['Manager','Actor','Makeup Artist','Crowd Control','Carnival Crew'],
  locations: ['Main Site','Storage Lot A','Storage Lot B','Office'],
  managerPin: '1234', adminPin: '5678', lunchRoles: [], lunchClockoutRoles: []

const S = {
  roster:[], punches:[], flags:{}, config:{...DEFS},
  selId:null, isAdmin:false, isPersonalDevice:false,
  tab:'status', viewDate:'', wkOff:0,
  pinBuf:'', pinErr:false, switchMode:false,
  empCodeBuf:'', empCodeErr:false, codeOk:false,
  editEmp:null, editRole:null,
  showFlagSearch:false, resetTimer:null, resetInterval:null
};
// Opening the app as .../?kiosk=1 marks the device a shared kiosk for good, so a
// bookmarked tablet keeps the setting even if its local storage gets wiped.
(function(){
  const q=new URLSearchParams(location.search);
  if(q.get('kiosk')==='1') localStorage.setItem('tc_deviceType','shared');
  if(q.get('kiosk')==='0') localStorage.removeItem('tc_deviceType');
})();
function deviceType(){ return localStorage.getItem('tc_deviceType')||''; }
function isSharedDevice(){ return deviceType()==='shared'; }

// Clock actions have to reach the database to count, so refuse them offline
// rather than let someone walk away believing they clocked in.
function requireOnline(){
  if(navigator.onLine) return true;
  showToast('⚠️ No connection — try again in a moment',3500);
  return false;
}
function syncOnlineState(){ document.body.classList.toggle('offline',!navigator.onLine); }
window.addEventListener('online',syncOnlineState);
window.addEventListener('offline',syncOnlineState);

// ── HELPERS ──────────────────────────────────────────────────
const p2 = n => String(n).padStart(2,'0');
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function dateKey(iso){ const d=new Date(iso); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true}); }
function fmtNow(){ return new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true}); }
function fmtToday(){ return new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}); }
function fmtDateDisp(ds){ return new Date(ds+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}); }
function isoToT(iso){ const d=new Date(iso); return `${p2(d.getHours())}:${p2(d.getMinutes())}`; }
function tToIso(t,ds){ return new Date(`${ds}T${t}:00`).toISOString(); }
function hoursD(ms){ return (Math.max(0,ms)/3600000).toFixed(2); }
function elapsed(ci){ const ms=Date.now()-new Date(ci); return `${Math.floor(ms/3600000)}h ${Math.floor((ms%3600000)/60000)}m`; }
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function getActive(eid){ return S.punches.find(p=>p.eid===eid&&!p.out)||null; }
function weekStart(off){ const d=new Date(); d.setDate(d.getDate()-d.getDay()+(off*7)); d.setHours(0,0,0,0); return d; }
function getFlag(eid,date){ return S.flags[`${eid}_${date}`]||{}; }
function netMs(eid,date){
  const ms = S.punches.filter(p=>p.eid===eid&&p.out&&dateKey(p.in)===date).reduce((s,p)=>s+(new Date(p.out)-new Date(p.in)),0);
  return Math.max(0, ms-(getFlag(eid,date).lunch ? 30*60*1000 : 0));
}
function normPunch(p){ return { id:p.id, eid:p.employee_id, name:p.employee_name, role:p.role, loc:p.location, in:p.clock_in, out:p.clock_out }; }
function lunchRoles(){ return S.config.lunchRoles||[]; }
function lunchClockoutRoles(){ return S.config.lunchClockoutRoles||[]; }
function roleHasLunchBtn(role){ return lunchRoles().includes(role); }
function roleClocksOutForLunch(role){ return lunchClockoutRoles().includes(role); }
function lunchMode(role){ return roleHasLunchBtn(role)?'button':(roleClocksOutForLunch(role)?'clockout':'none'); }
// Roles / locations an employee is authorised for. Empty list = all of them.
function empRoles(emp){ const a=(emp?.roles||[]).filter(r=>S.config.roles.includes(r)); return a.length?a:S.config.roles; }
function empLocs(emp){ const a=(emp?.locations||[]).filter(l=>S.config.locations.includes(l)); return a.length?a:S.config.locations; }
// A clock-out role counts as having taken lunch if there is a >=30min gap between shifts.
function hasLunchGap(eid,date){
  const ps=S.punches.filter(p=>p.eid===eid&&dateKey(p.in)===date).sort((a,b)=>new Date(a.in)-new Date(b.in));
  for(let i=1;i<ps.length;i++){
    if(!ps[i-1].out) continue;
    if(new Date(ps[i].in)-new Date(ps[i-1].out)>=30*60*1000) return true;
  }
  return false;
}
// Time on the clock for a date, counting a shift that is still running up to now
// so the 6-hour break alert fires during the shift rather than after it ends.
function grossMs(eid,date){
  const dayEnd=new Date(date+'T23:59:59').getTime();
  return S.punches.filter(p=>p.eid===eid&&dateKey(p.in)===date).reduce((s,p)=>{
    const end=p.out?new Date(p.out).getTime():Math.min(Date.now(),dayEnd);
    return s+Math.max(0,end-new Date(p.in).getTime());
  },0);
}
function hadNonLunchRole(eid,date){ return S.punches.some(p=>p.eid===eid&&dateKey(p.in)===date&&lunchMode(p.role)==='clockout'); }
// A clock-out break only excuses the penalty if it STARTED before the employee
// reached the 6-hour mark. Clocking out for lunch after that is a late break —
// the penalty is already owed and has to stay on the record for payroll.
function lunchGapBefore(eid,date,limitMs){
  const ps=S.punches.filter(p=>p.eid===eid&&dateKey(p.in)===date).sort((a,b)=>new Date(a.in)-new Date(b.in));
  let worked=0;
  for(let i=0;i<ps.length;i++){
    const p=ps[i]; if(!p.out) break;
    worked+=new Date(p.out)-new Date(p.in);
    const next=ps[i+1]; if(!next) break;
    if(worked<limitMs && new Date(next.in)-new Date(p.out)>=30*60*1000) return true;
  }
  return false;
}

function dayAlerts(eid,date){
  const hrs=grossMs(eid,date)/3600000, fl=getFlag(eid,date);
  // The lunch button clears the penalty whenever it is pressed; a clock-out only
  // clears it if the break began before the 6-hour mark.
  const excused=fl.lunch||lunchGapBefore(eid,date,6*3600000);
  return { mbp: hadNonLunchRole(eid,date)&&hrs>=6&&!excused, ot: hrs>=8 };
}
function alertChips(eid,date){
  const a=dayAlerts(eid,date);
  return `${a.mbp?'<span class="chip chip-red">MBP</span>':''}${a.ot?'<span class="chip chip-amber">OT</span>':''}`;
}

function showToast(msg, ms=2500){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),ms);
}

// ── DATABASE ─────────────────────────────────────────────────
async function loadAll(){
  const [eR,pR,fR,cR] = await Promise.all([
    db.from('tc_employees').select('*').order('name'),
    db.from('tc_punches').select('*').order('clock_in'),
    db.from('tc_day_flags').select('*'),
    db.from('tc_config').select('*').eq('id',1).single()
  ]);
  if(eR.data) S.roster = eR.data.map(e=>({id:e.id,name:e.name,code:e.code||'',roles:e.roles||[],locations:e.locations||[]}));
  if(pR.data) S.punches = pR.data.map(normPunch);
  if(fR.data){ S.flags={}; fR.data.forEach(f=>{ S.flags[`${f.employee_id}_${f.flag_date}`]={lunch:f.lunch,ncns:f.ncns,short:f.short_notice}; }); }
  if(cR.data) S.config={roles:cR.data.roles,locations:cR.data.locations,managerPin:cR.data.manager_pin,adminPin:cR.data.admin_pin,lunchRoles:cR.data.lunch_roles||[],lunchClockoutRoles:cR.data.lunch_clockout_roles||[]};
  // Carry the real reason up instead of a generic failure — "check your internet"
  // sends people looking in the wrong place when the database is the problem.
  const err=eR.error||pR.error||fR.error;
  if(err){ const e=new Error(err.message||'Load failed'); e.detail=err; throw e; }
}

// Turn a Supabase error into something a manager can act on.
function explainDbError(err){
  const raw=(err&&(err.message||''))+'';
  const code=err&&err.detail&&err.detail.code;
  const low=raw.toLowerCase();
  if(!navigator.onLine) return ['You are offline','Connect to wifi or cell service, then try again.'];
  if(low.includes('failed to fetch')||low.includes('networkerror')||low.includes('load failed'))
    return ['Cannot reach the database','The database may be waking up or briefly unavailable. Wait a minute and try again.'];
  if(code==='42P01'||low.includes('does not exist'))
    return ['Database not set up','A table is missing. The setup SQL needs to be run in Supabase.'];
  if(code==='42501'||low.includes('permission denied')||low.includes('row-level security'))
    return ['Database permissions','The app is not allowed to read the tables. Permissions need fixing in Supabase.'];
  if(low.includes('jwt')||low.includes('api key')||low.includes('invalid authentication'))
    return ['Database key rejected','The API key in the app no longer matches the project.'];
  return ['Could not load your data',raw||'Unknown error.'];
}

async function dbClockIn(eid,name,role,loc){
  const id=genId(), now=new Date().toISOString();
  const {error}=await db.from('tc_punches').insert({id,employee_id:eid,employee_name:name,role,location:loc,clock_in:now});
  if(!error) S.punches.push({id,eid,name,role,loc,in:now,out:null});
  return !error;
}
async function dbClockOut(punchId){
  const now=new Date().toISOString();
  const {error}=await db.from('tc_punches').update({clock_out:now}).eq('id',punchId);
  if(!error) S.punches=S.punches.map(p=>p.id===punchId?{...p,out:now}:p);
  return !error;
}
async function dbSwitchRole(punchId,newRole,newLoc){
  const now=new Date().toISOString(), old=S.punches.find(p=>p.id===punchId);
  const newId=genId();
  await Promise.all([
    db.from('tc_punches').update({clock_out:now}).eq('id',punchId),
    db.from('tc_punches').insert({id:newId,employee_id:old.eid,employee_name:old.name,role:newRole,location:newLoc,clock_in:now})
  ]);
  S.punches=S.punches.map(p=>p.id===punchId?{...p,out:now}:p);
  S.punches.push({id:newId,eid:old.eid,name:old.name,role:newRole,loc:newLoc,in:now,out:null});
}
async function dbEditTime(punchId,field,newIso){
  const col=field==='in'?'clock_in':'clock_out';
  await db.from('tc_punches').update({[col]:newIso}).eq('id',punchId);
  S.punches=S.punches.map(p=>p.id===punchId?{...p,[field]:newIso}:p);
}
async function dbSetFlag(eid,date,flags){
  const id=`${eid}_${date}`;
  await db.from('tc_day_flags').upsert({id,employee_id:eid,flag_date:date,lunch:!!flags.lunch,ncns:!!flags.ncns,short_notice:!!flags.short});
  S.flags[`${eid}_${date}`]=flags;
}
async function dbSaveEmployee(emp){
  const row={id:emp.id,name:emp.name,code:emp.code||null,roles:emp.roles||[],locations:emp.locations||[]};
  const {error}=await db.from('tc_employees').upsert(row);
  if(error) return false;
  const i=S.roster.findIndex(e=>e.id===emp.id);
  if(i>=0) S.roster[i]={...emp}; else S.roster.push({...emp});
  S.roster.sort((a,b)=>a.name.localeCompare(b.name));
  return true;
}
async function dbDeleteEmployee(id){
  const {error}=await db.from('tc_employees').delete().eq('id',id);
  if(error) return false;
  S.roster=S.roster.filter(e=>e.id!==id);
  return true;
}
async function dbSaveConfig(cfg){
  const {error}=await db.from('tc_config').update({roles:cfg.roles,locations:cfg.locations,manager_pin:cfg.managerPin,admin_pin:cfg.adminPin,lunch_roles:cfg.lunchRoles,lunch_clockout_roles:cfg.lunchClockoutRoles}).eq('id',1);
  if(!error) S.config=cfg;
  return !error;
}
async function dbDeletePunch(pid){
  const {error}=await db.from('tc_punches').delete().eq('id',pid);
  if(!error) S.punches=S.punches.filter(p=>p.id!==pid);
  return !error;
}

function setupRealtime(){
  db.channel('tc-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'tc_punches'},payload=>{
      if(payload.eventType==='INSERT'&&!S.punches.find(p=>p.id===payload.new.id)) S.punches.push(normPunch(payload.new));
      else if(payload.eventType==='UPDATE') S.punches=S.punches.map(p=>p.id===payload.new.id?normPunch(payload.new):p);
      else if(payload.eventType==='DELETE') S.punches=S.punches.filter(p=>p.id!==payload.old.id);
      const sc=document.querySelector('.screen.on');
      if(sc?.id==='dashboard'&&(S.tab==='daily'||S.tab==='status')) renderDash();
    })
    .subscribe();
}

// ── EMPLOYEE CODE ────────────────────────────────────────────
function openEmp(eid){
  const emp=S.roster.find(e=>e.id===eid); if(!emp)return;
  S.selId=eid; S.switchMode=false; S.codeOk=false;
  if(!emp.code){ S.codeOk=true; showEmpScreen(); return; }
  S.empCodeBuf=''; S.empCodeErr=false;
  document.getElementById('ec-name').textContent=emp.name;
  document.getElementById('ec-msg').textContent='Enter your 6-digit code';
  buildEmpCode(); show('emp-code');
}
function buildEmpCode(){
  const dots=document.getElementById('ec-dots'),pad=document.getElementById('ec-pad'); if(!dots||!pad)return;
  dots.innerHTML=Array.from({length:6}).map((_,i)=>`<div style="width:14px;height:14px;border-radius:50%;background:${i<S.empCodeBuf.length?(S.empCodeErr?'#E53935':'#EF9F27'):'#E5E5EA'}"></div>`).join('');
  pad.innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(d=>`<button class="pin-key" onclick="${d==='⌫'?'ecBack()':d?`ecDigit('${d}')`:''}">`+d+'</button>').join('');
}
function ecDigit(d){
  if(S.empCodeBuf.length>=6)return;
  S.empCodeBuf+=d; buildEmpCode();
  if(S.empCodeBuf.length<6)return;
  const emp=S.roster.find(e=>e.id===S.selId);
  if(emp&&S.empCodeBuf===emp.code){ S.codeOk=true; setTimeout(showEmpScreen,100); return; }
  S.empCodeErr=true; buildEmpCode();
  document.getElementById('ec-msg').textContent='Incorrect code — try again';
  setTimeout(()=>{S.empCodeBuf='';S.empCodeErr=false;buildEmpCode()},700);
}
function ecBack(){ S.empCodeBuf=S.empCodeBuf.slice(0,-1); buildEmpCode(); }

// ── EMPLOYEE SCREEN ──────────────────────────────────────────
function showEmpScreen(){
  const emp=S.roster.find(e=>e.id===S.selId);
  document.getElementById('emp-hdr').textContent=emp?emp.name:'';
  renderEmpBody(); show('employee');
}

function canClockIn(eid){
  const today=todayKey();
  const outs=S.punches.filter(p=>p.eid===eid&&p.out&&dateKey(p.out)===today).sort((a,b)=>new Date(b.out)-new Date(a.out));
  if(!outs.length)return{ok:true};
  const diff=Date.now()-new Date(outs[0].out).getTime();
  if(diff<30*60*1000){const wu=new Date(new Date(outs[0].out).getTime()+30*60*1000);return{ok:false,wu}}
  return{ok:true};
}

function weekSummary(eid){
  const ws=weekStart(0),we=new Date(ws.getTime()+7*864e5);
  const wkp=S.punches.filter(p=>p.eid===eid&&p.out&&new Date(p.in)>=ws&&new Date(p.in)<we);
  const byRole={}; wkp.forEach(p=>{const ms=new Date(p.out)-new Date(p.in);byRole[p.role]=(byRole[p.role]||0)+ms});
  return{byRole,totalMs:Object.values(byRole).reduce((a,b)=>a+b,0)};
}

function renderEmpBody(){
  const emp=S.roster.find(e=>e.id===S.selId); if(!emp){goHome();return}
  const act=getActive(emp.id);
  const body=document.getElementById('emp-body'); if(!body)return;
  const{byRole,totalMs}=weekSummary(emp.id);
  const weekHtml=totalMs>0?`<div class="card" style="margin-top:4px"><div class="ml" style="margin-bottom:10px">My week so far</div>${Object.entries(byRole).map(([r,ms])=>`<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px"><span>${r}</span><span style="font-weight:500">${hoursD(ms)} hrs</span></div>`).join('')}<div style="border-top:1px solid #E5E5EA;margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;font-size:14px;font-weight:500"><span>Total</span><span>${hoursD(totalMs)} hrs</span></div></div>`:'';
  const notYouHtml=S.isPersonalDevice?`<div style="text-align:center;margin-top:16px"><button onclick="forgetDevice()" style="background:none;border:none;font-size:12px;color:#8E8E93;cursor:pointer;text-decoration:underline">Not ${emp.name}? Switch user</button></div>`:'';
  const mainBtn=`<button class="btn btn-ghost" onclick="cancelAndGoHome()" style="margin-top:14px"><i class="ti ti-home"></i> Return to main</button>`;
  const statusHtml=buildMyStatus(emp.id);
  const myRoles=empRoles(emp), myLocs=empLocs(emp);
  // A single authorised option is chosen automatically — the picker is hidden but still supplies the value.
  const picker=(id,label,opts)=>opts.length===1
    ? `<div style="margin-top:12px"><div style="font-size:12px;color:#6C6C70">${label}</div><div style="font-size:15px;font-weight:500;margin-top:4px">${opts[0]}</div><select id="${id}" style="display:none"><option>${opts[0]}</option></select></div>`
    : `<label>${label}</label><select id="${id}" style="margin-top:6px">${opts.map(o=>`<option>${o}</option>`).join('')}</select>`;

  if(!myRoles.length||!myLocs.length){
    body.innerHTML=`<div class="warn"><div style="font-weight:500;font-size:14px;color:#BA7517;margin-bottom:2px"><i class="ti ti-alert-triangle"></i> Nothing assigned yet</div><div style="font-size:13px;color:#854F0B">An admin needs to assign you at least one role and location before you can clock in.</div></div>${mainBtn}`;
    return;
  }
  if(act){
    const canLunch=roleHasLunchBtn(act.role)&&!getFlag(emp.id,todayKey()).lunch;
    const lunchBtn=canLunch?`<button class="btn btn-amber" onclick="takeLunch()"><i class="ti ti-tools-kitchen-2"></i> Take lunch (30 min)</button>`:'';
    body.innerHTML=`<div class="active-card"><div class="ml" style="color:#3B6D11;margin-bottom:8px">Currently clocked in</div><div style="font-size:20px;font-weight:500;margin-bottom:2px">${act.role}</div><div style="font-size:13px;color:#6C6C70;margin-bottom:14px">${act.loc}</div><div style="display:flex;gap:24px"><div><div class="ml">Clock in</div><div style="font-size:15px;font-weight:500;margin-top:3px">${fmtTime(act.in)}</div></div><div><div class="ml">Elapsed</div><div id="el-val" style="font-size:15px;font-weight:500;margin-top:3px">${elapsed(act.in)}</div></div></div></div>${S.switchMode?`<div class="card"><div style="font-weight:500;margin-bottom:4px">Switch to…</div>${picker('sw-r','New role',myRoles)}${picker('sw-l','Location',myLocs)}<button class="btn btn-amber" onclick="doSwitch('${act.id}')">Confirm switch</button><button class="btn btn-ghost" onclick="S.switchMode=false;renderEmpBody()">Cancel</button></div>`:`${lunchBtn}<button class="btn btn-ghost" onclick="S.switchMode=true;renderEmpBody()"><i class="ti ti-refresh"></i> Switch role / location</button><button class="btn btn-red" onclick="doClockOut('${act.id}')">Clock out</button>`}${statusHtml}${weekHtml}${mainBtn}${notYouHtml}`;
  } else {
    const chk=canClockIn(emp.id);
    body.innerHTML=`${!chk.ok?`<div class="warn"><div style="font-weight:500;font-size:14px;color:#BA7517;margin-bottom:2px"><i class="ti ti-clock"></i> Break in progress</div><div style="font-size:13px;color:#854F0B">You can clock back in after <strong>${chk.wu.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true})}</strong></div></div>`:''}<div class="card"><div style="font-size:14px;color:#6C6C70;margin-bottom:4px">${myRoles.length===1&&myLocs.length===1?'Confirm and clock in':'Select your role and location'}</div>${picker('ci-r','Role',myRoles)}${picker('ci-l','Location',myLocs)}</div><button class="btn btn-green" onclick="doClockIn()" ${!chk.ok?'disabled style="opacity:.4;cursor:not-allowed"':''}>Clock in</button>${statusHtml}${weekHtml}${mainBtn}${notYouHtml}`;
  }
}

function buildMyStatus(eid){
  const today=todayKey(), act=getActive(eid), fl=getFlag(eid,today);
  const eps=S.punches.filter(p=>p.eid===eid&&dateKey(p.in)===today).sort((a,b)=>new Date(a.in)-new Date(b.in));
  if(!eps.length&&!fl.lunch) return `<div class="card" style="margin-top:4px"><div class="ml" style="margin-bottom:8px">Today's status</div><div style="font-size:14px;color:#6C6C70">No activity yet today.</div></div>`;
  const chk=canClockIn(eid);
  const rows=[];
  if(eps.length) rows.push(['First clock in', fmtTime(eps[0].in)]);
  if(act) rows.push(['Current shift', `${act.role} · ${act.loc}`]);
  else if(eps.length){ const last=eps[eps.length-1]; if(last.out) rows.push(['Last clock out', fmtTime(last.out)]); }
  rows.push(['Lunch', fl.lunch?'Taken (30 min deducted)':(hasLunchGap(eid,today)?'Taken (clocked out)':'Not taken')]);
  rows.push(['Hours today', `${hoursD(netMs(eid,today))} hrs`]);
  if(!act&&!chk.ok) rows.push(['Can clock back in', chk.wu.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true})]);
  else if(!act) rows.push(['Can clock back in','Now']);
  return `<div class="card" style="margin-top:4px"><div class="ml" style="margin-bottom:10px">Today's status</div>${rows.map(([k,v])=>`<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;gap:12px"><span style="color:#6C6C70">${k}</span><span style="font-weight:500;text-align:right">${v}</span></div>`).join('')}</div>`;
}

async function takeLunch(){
  if(!requireOnline())return;
  const eid=S.selId, today=todayKey();
  if(getFlag(eid,today).lunch){showToast('Lunch already taken today');return}
  const k=`${eid}_${today}`; const f={...(S.flags[k]||{}),lunch:true};
  await dbSetFlag(eid,today,f);
  showToast('Lunch recorded — 30 min deducted ✓'); renderEmpBody();
}

async function doClockIn(){
  const emp=S.roster.find(e=>e.id===S.selId); if(!emp||!canClockIn(emp.id).ok)return;
  if(!requireOnline())return;
  const role=document.getElementById('ci-r').value, loc=document.getElementById('ci-l').value;
  if(!empRoles(emp).includes(role)||!empLocs(emp).includes(loc)){showToast('⚠️ You are not assigned to that role or location');return;}
  const ok=await dbClockIn(emp.id,emp.name,role,loc);
  if(!ok){showToast('⚠️ Save failed — check connection');return}
  if(S.isPersonalDevice){ showToast(`Clocked in as ${role} ✓`); renderEmpBody(); }
  else if(isSharedDevice()){ finishAndGoHome(`Clocked in as ${role} ✓`); }
  else { offerRememberMe(emp,role); }
}

async function doClockOut(pid){
  if(!requireOnline())return;
  const ok=await dbClockOut(pid);
  if(!ok){showToast('⚠️ Save failed — check connection');return}
  if(S.isPersonalDevice){ showToast('Clocked out ✓'); renderEmpBody(); }
  else { finishAndGoHome('Clocked out — have a great day!'); }
}

async function doSwitch(pid){
  if(!requireOnline())return;
  const nr=document.getElementById('sw-r').value, nl=document.getElementById('sw-l').value;
  const emp=S.roster.find(e=>e.id===S.selId);
  if(!empRoles(emp).includes(nr)||!empLocs(emp).includes(nl)){showToast('⚠️ You are not assigned to that role or location');return;}
  await dbSwitchRole(pid,nr,nl); S.switchMode=false;
  if(S.isPersonalDevice){ showToast(`Switched to ${nr} ✓`); renderEmpBody(); }
  else { finishAndGoHome(`Switched to ${nr} ✓`); }
}

function offerRememberMe(emp,role){
  const body=document.getElementById('emp-body'); if(!body)return;
  body.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:32px">
    <i class="ti ti-circle-check" style="font-size:56px;color:#3B6D11;display:block;margin-bottom:20px"></i>
    <div style="font-size:20px;font-weight:500;margin-bottom:6px">Clocked in as ${role}</div>
    <div style="font-size:14px;color:#6C6C70;margin-bottom:28px">Is this your personal phone?</div>
    <button onclick="rememberMe()" class="btn btn-green" style="max-width:280px;margin-top:0">Yes — save my name to this phone</button>
    <button onclick="markShared()" class="btn btn-ghost" style="max-width:280px">No — shared / tablet device</button>
  </div>`;
}

function markShared(){ localStorage.setItem('tc_deviceType','shared'); finishAndGoHome(''); }

function rememberMe(){
  localStorage.setItem('tc_empId',S.selId);
  S.isPersonalDevice=true; renderEmpBody(); showToast('Saved to this device ✓');
}

function forgetDevice(){
  localStorage.removeItem('tc_empId'); S.isPersonalDevice=false; S.selId=null; goHome();
}

function finishAndGoHome(msg){ clearReset(); goHome(); if(msg) showToast(msg,3000); }

// ── PIN ──────────────────────────────────────────────────────
function buildPin(){
  const len=Math.max(S.config.managerPin.length,S.config.adminPin.length);
  const dots=document.getElementById('pin-dots'),pad=document.getElementById('pin-pad'); if(!dots||!pad)return;
  dots.innerHTML=Array.from({length:len}).map((_,i)=>`<div style="width:14px;height:14px;border-radius:50%;background:${i<S.pinBuf.length?(S.pinErr?'#E53935':'#EF9F27'):'#E5E5EA'}"></div>`).join('');
  pad.innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(d=>`<button class="pin-key" onclick="${d==='⌫'?'pinBack()':d?`pinDigit('${d}')`:''}">` +d+'</button>').join('');
}
function pinDigit(d){
  S.pinBuf+=d; buildPin();
  if(S.pinBuf===S.config.adminPin){S.isAdmin=true;setTimeout(openDash,100);return}
  if(S.pinBuf===S.config.managerPin){S.isAdmin=false;setTimeout(openDash,100);return}
  if(S.pinBuf.length>=Math.max(S.config.managerPin.length,S.config.adminPin.length)){S.pinErr=true;buildPin();setTimeout(()=>{S.pinBuf='';S.pinErr=false;buildPin()},600)}
}
function pinBack(){ S.pinBuf=S.pinBuf.slice(0,-1); buildPin(); }

// ── DASHBOARD ────────────────────────────────────────────────
function openDash(){
  S.tab='status'; S.viewDate=todayKey(); S.wkOff=0; S.showFlagSearch=false;
  document.getElementById('dash-title').textContent=S.isAdmin?'Admin':'Manager';
  renderDashTabs(); renderDash(); show('dashboard');
}
function renderDashTabs(){
  const tabs=[['status','Status'],['daily','Daily'],['weekly','Weekly']]; if(S.isAdmin)tabs.push(['settings','Settings']);
  document.getElementById('dash-tabs').innerHTML=tabs.map(([id,lbl])=>`<button class="tab${S.tab===id?' on':''}" onclick="setTab('${id}')">${lbl}</button>`).join('');
}
function setTab(t){ S.tab=t; S.showFlagSearch=false; S.editEmp=null; S.editRole=null; renderDashTabs(); renderDash(); }
function renderDash(){ const b=document.getElementById('dash-body'); if(!b)return; if(S.tab==='status')b.innerHTML=buildStatus(); else if(S.tab==='daily')b.innerHTML=buildDaily(); else if(S.tab==='weekly')b.innerHTML=buildWeekly(); else b.innerHTML=buildSettings(); }

// ── QUICK STATUS (live) ──────────────────────────────────────
function buildStatus(){
  const today=todayKey();
  const active=S.punches.filter(p=>!p.out).sort((a,b)=>new Date(a.in)-new Date(b.in));
  const header=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><div style="font-weight:500;font-size:15px">Clocked in now</div><div style="font-size:12px;color:#6C6C70">${active.length} ${active.length===1?'person':'people'} on the clock</div></div><button class="wn" onclick="renderDash()" style="font-size:13px">Refresh</button></div>`;
  if(!active.length) return header+`<div style="text-align:center;color:#6C6C70;margin-top:40px;font-size:14px">Nobody is clocked in right now</div>`;
  const byLoc={};
  active.forEach(p=>{ (byLoc[p.loc]=byLoc[p.loc]||[]).push(p); });
  const blocks=Object.entries(byLoc).sort(([a],[b])=>a.localeCompare(b)).map(([loc,ps])=>{
    const rows=ps.sort((a,b)=>a.name.localeCompare(b.name)).map(p=>{
      const fl=getFlag(p.eid,today);
      const m=lunchMode(p.role);
      const lunch=(fl.lunch||hasLunchGap(p.eid,today))?'<span class="chip chip-green">Lunch taken</span>'
        :m==='button'?'<span class="chip chip-amber">No lunch yet</span>'
        :m==='clockout'?'<span class="chip chip-amber">Has not clocked out for lunch</span>':'';
      return `<div class="pr"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><span style="font-weight:500;font-size:15px">${p.name}</span><span style="font-size:13px;color:#6C6C70">${elapsed(p.in)}</span></div><div style="font-size:13px;color:#6C6C70;margin-top:2px">${p.role} · in at ${fmtTime(p.in)}</div><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${lunch}${alertChips(p.eid,today)}</div></div>`;
    }).join('');
    return `<div class="tc"><div class="th"><span>${loc}</span><span style="font-size:12px;font-weight:400;color:#6C6C70">${ps.length}</span></div>${rows}</div>`;
  }).join('');
  return header+blocks;
}

// ── DAILY VIEW ───────────────────────────────────────────────
function buildDaily(){
  const date=S.viewDate;
  const dayPs=S.punches.filter(p=>dateKey(p.in)===date||(p.out&&dateKey(p.out)===date));
  const eids=[...new Set([...dayPs.map(p=>p.eid),...Object.keys(S.flags).filter(k=>k.endsWith('_'+date)).map(k=>k.slice(0,-(date.length+1)))])];
  const empCards=eids.length===0?`<div style="text-align:center;color:#6C6C70;margin-top:40px;font-size:14px">No activity on this date</div>`:eids.map(eid=>{
    const name=S.roster.find(e=>e.id===eid)?.name||dayPs.find(p=>p.eid===eid)?.name||'Unknown';
    const eps=dayPs.filter(p=>p.eid===eid).sort((a,b)=>new Date(a.in)-new Date(b.in));
    const fl=getFlag(eid,date);
    return`<div class="tc"><div class="th"><span>${name}</span><div style="display:flex;align-items:center;gap:6px">${alertChips(eid,date)}<span id="hrs-${eid}" style="font-size:12px;font-weight:400;color:#6C6C70">${hoursD(netMs(eid,date))} hrs</span></div></div>${eps.map(p=>`<div class="pr"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div class="ml">${p.role} · ${p.loc}</div>${S.isAdmin?`<button class="del" onclick="deletePunch('${p.id}')"><i class="ti ti-trash"></i> Delete</button>`:''}</div><div style="display:flex;align-items:center;gap:8px"><div style="flex:1"><div style="font-size:10px;color:#6C6C70;margin-bottom:3px">IN</div><input type="time" value="${isoToT(p.in)}" onchange="editTime('${p.id}','in',this.value)"/></div><span style="color:#C7C7CC;margin-top:14px;flex-shrink:0">→</span><div style="flex:1"><div style="font-size:10px;color:#6C6C70;margin-bottom:3px">OUT</div>${p.out?`<input type="time" value="${isoToT(p.out)}" onchange="editTime('${p.id}','out',this.value)"/>`:`<div style="font-size:12px;color:#3B6D11;padding:6px 8px;border:1px solid #3B6D11;border-radius:8px;text-align:center">Active</div>`}</div></div></div>`).join('')}<div class="cr"><label class="cl"><input type="checkbox" ${fl.lunch?'checked':''} onchange="setFlag('${eid}','${date}','lunch',this.checked)" style="width:auto;margin:0"/>Deduct 30-min lunch</label></div><div class="cr"><label class="cl"><input type="checkbox" ${fl.ncns?'checked':''} onchange="setFlag('${eid}','${date}','ncns',this.checked)" style="width:auto;margin:0"/>No Call No Show</label><label class="cl"><input type="checkbox" ${fl.short?'checked':''} onchange="setFlag('${eid}','${date}','short',this.checked)" style="width:auto;margin:0">&lt;2hr Notice</label></div></div>`;
  }).join('');
  const flagSection=S.showFlagSearch?`<div class="card" style="margin-top:12px"><div style="font-weight:500;margin-bottom:8px">Flag absent employee</div><input id="fs" placeholder="Type name…" oninput="renderFlagSearch()" autocomplete="off" style="margin-top:0"/><div id="fsr" style="margin-top:8px"></div><button class="btn btn-ghost" onclick="S.showFlagSearch=false;renderDash()" style="margin-top:8px">Cancel</button></div>`:'';
  return`<div class="wb"><button class="wn" onclick="changeDay(-1)">&#8592; Prev</button><div style="text-align:center"><div style="font-weight:500;font-size:13px">${fmtDateDisp(date)}</div>${date===todayKey()?'<div style="font-size:11px;color:#BA7517;font-weight:500">Today</div>':''}</div><button class="wn" onclick="changeDay(1)" ${date>=todayKey()?'disabled style="opacity:.3"':''}>Next &#8594;</button></div>${empCards}${flagSection}<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button onclick="S.showFlagSearch=!S.showFlagSearch;renderDash()" style="background:none;border:1px solid #C7C7CC;border-radius:8px;padding:7px 12px;font-size:13px;color:#6C6C70;cursor:pointer"><i class="ti ti-flag"></i> Flag absent employee</button>${S.isAdmin?`<button onclick="exportCSV('day')" style="background:#EF9F27;border:none;border-radius:8px;padding:7px 12px;font-size:13px;color:#412402;cursor:pointer"><i class="ti ti-download"></i> Export day</button>`:''}</div>`;
}

function renderFlagSearch(){
  const q=(document.getElementById('fs')||{}).value||'';
  const el=document.getElementById('fsr'); if(!el)return;
  if(!q.trim()){el.innerHTML='';return}
  const f=S.roster.filter(e=>e.name.toLowerCase().includes(q.toLowerCase())).slice(0,5);
  el.innerHTML=f.length?f.map(e=>`<button onclick="addFlagEmp('${e.id}')" style="display:block;width:100%;padding:10px 12px;background:#F9F9FB;border:1px solid #E5E5EA;border-radius:8px;text-align:left;cursor:pointer;font-size:14px;font-family:inherit;color:#000;margin-bottom:4px">${e.name}</button>`).join(''):`<p style="font-size:13px;color:#6C6C70">No match</p>`;
}
async function deletePunch(pid){
  const p=S.punches.find(x=>x.id===pid); if(!p)return;
  const label=`${p.name} — ${p.role} at ${fmtTime(p.in)}${p.out?' to '+fmtTime(p.out):' (still active)'}`;
  if(!confirm(`Delete this entry?\n\n${label}\n\nThis cannot be undone.`))return;
  const ok=await dbDeletePunch(pid);
  showToast(ok?'Entry deleted ✓':'⚠️ Delete failed'); renderDash();
}
function addFlagEmp(eid){ const k=`${eid}_${S.viewDate}`; if(!S.flags[k])S.flags[k]={}; dbSetFlag(eid,S.viewDate,S.flags[k]); S.showFlagSearch=false; renderDash(); }
function changeDay(d){ const dt=new Date(S.viewDate+'T12:00:00'); dt.setDate(dt.getDate()+d); const nk=dateKey(dt.toISOString()); if(nk>todayKey())return; S.viewDate=nk; renderDash(); }
function editTime(pid,field,t){
  const punch=S.punches.find(p=>p.id===pid); if(!punch)return;
  const base=(field==='in'?punch.in:(punch.out||punch.in)).split('T')[0];
  const newIso=tToIso(t,base);
  dbEditTime(pid,field,newIso);
  const el=document.getElementById(`hrs-${punch.eid}`);
  if(el)el.textContent=`${hoursD(netMs(punch.eid,S.viewDate))} hrs`;
}
function setFlag(eid,date,field,val){
  const k=`${eid}_${date}`; if(!S.flags[k])S.flags[k]={}; S.flags[k][field]=val;
  dbSetFlag(eid,date,S.flags[k]);
  if(field==='lunch'){const el=document.getElementById(`hrs-${eid}`);if(el)el.textContent=`${hoursD(netMs(eid,date))} hrs`}
}

// ── WEEKLY VIEW ──────────────────────────────────────────────
function buildWeekly(){
  const ws=weekStart(S.wkOff),we=new Date(ws); we.setDate(we.getDate()+6);
  const fmtWk=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const wEnd=new Date(we.getTime()+864e5);
  const wkp=S.punches.filter(p=>p.out&&new Date(p.in)>=ws&&new Date(p.in)<wEnd);
  const sum={};
  wkp.forEach(p=>{ if(!sum[p.eid])sum[p.eid]={name:p.name,roles:{},dates:new Set()}; const ms=new Date(p.out)-new Date(p.in); sum[p.eid].roles[p.role]=(sum[p.eid].roles[p.role]||0)+ms; sum[p.eid].dates.add(dateKey(p.in)); });
  const empList=Object.entries(sum).sort(([,a],[,b])=>a.name.localeCompare(b.name));
  return`<div class="wb"><button class="wn" onclick="S.wkOff--;renderDash()">&#8592; Prev</button><div style="text-align:center"><div style="font-weight:500;font-size:14px">${fmtWk(ws)} – ${fmtWk(we)}</div>${S.wkOff===0?'<div style="font-size:11px;color:#BA7517;font-weight:500">Current week</div>':''}</div><button class="wn" onclick="if(S.wkOff<0){S.wkOff++;renderDash()}" ${S.wkOff>=0?'disabled style="opacity:.3"':''}>Next &#8594;</button></div>${S.isAdmin?`<button onclick="exportCSV('week')" style="width:100%;padding:12px;border-radius:12px;border:none;background:#EF9F27;color:#412402;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:14px"><i class="ti ti-download"></i> Export CSV</button>`:''} ${empList.length===0?`<div style="text-align:center;color:#6C6C70;font-size:14px;margin-top:30px">No completed shifts this week</div>`:''}${empList.map(([eid,data])=>{ const rawMs=Object.values(data.roles).reduce((a,b)=>a+b,0); const ld=[...data.dates].filter(dk=>getFlag(eid,dk).lunch).length*30*60*1000; const net=Math.max(0,rawMs-ld); const hasN=[...data.dates].some(dk=>getFlag(eid,dk).ncns); const hasS=[...data.dates].some(dk=>getFlag(eid,dk).short); const mbpDays=[...data.dates].filter(dk=>dayAlerts(eid,dk).mbp).length; const otDays=[...data.dates].filter(dk=>dayAlerts(eid,dk).ot).length; const otWeek=net>=40*3600000; return`<div class="tc"><div class="th"><span>${data.name}</span><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end">${mbpDays?`<span class="chip chip-red">MBP ×${mbpDays}</span>`:''}${otDays?`<span class="chip chip-amber">OT day ×${otDays}</span>`:''}${otWeek?'<span class="chip chip-amber">OT week</span>':''}${hasN?'<span class="chip chip-red">NCNS</span>':''}${hasS?'<span class="chip chip-amber">&lt;2hr</span>':''}<span style="font-size:12px;font-weight:400;color:#6C6C70">${hoursD(net)} hrs</span></div></div>${Object.entries(data.roles).map(([r,ms])=>`<div style="padding:6px 16px;display:flex;justify-content:space-between;font-size:13px;border-bottom:1px solid #E5E5EA"><span style="color:#6C6C70">${r}</span><span>${hoursD(ms)}</span></div>`).join('')}${ld>0?`<div style="padding:6px 16px;display:flex;justify-content:space-between;font-size:12px;border-bottom:1px solid #E5E5EA;color:#A32D2D"><span>Lunch deductions</span><span>-${hoursD(ld)}</span></div>`:''}<div class="tt"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:500"><span style="color:#3B6D11">Net total</span><span style="color:#173404">${hoursD(net)}</span></div></div></div>`; }).join('')}`;
}

// ── EMPLOYEE EDITOR ──────────────────────────────────────────
function openEmpEditor(id){
  const e=id?S.roster.find(x=>x.id===id):null;
  S.editEmp = e ? {...e, roles:[...(e.roles||[])], locations:[...(e.locations||[])]}
                : {id:genId(), name:'', code:'', roles:[], locations:[], isNew:true};
  renderDash();
}
function closeEditor(){ S.editEmp=null; S.editRole=null; renderDash(); }

function buildEmpEditor(){
  const e=S.editEmp;
  const box=(cls,list,sel)=>list.length
    ? list.map(v=>`<label class="cl" style="padding:4px 0"><input type="checkbox" class="${cls}" value="${esc(v)}" ${sel.includes(v)?'checked':''} style="width:auto;margin:0"/>${esc(v)}</label>`).join('')
    : `<div style="font-size:13px;color:#6C6C70">None configured yet.</div>`;
  return `<div>
    <div class="card">
      <div style="font-weight:500;font-size:16px;margin-bottom:4px">${e.isNew?'Add new employee':'Edit employee'}</div>
      <label>Full name</label>
      <input id="ee-name" value="${esc(e.name)}" placeholder="Jane Doe" autocomplete="off"/>
      <label>6-digit code</label>
      <input id="ee-code" value="${esc(e.code||'')}" inputmode="numeric" maxlength="6" placeholder="Leave blank for no code" autocomplete="off" style="font-family:monospace;font-size:18px;letter-spacing:4px"/>
      <div style="font-size:12px;color:#6C6C70;margin-top:4px">They type this on the keypad to clock in or out.</div>
    </div>
    <div class="card">
      <div style="font-size:13px;font-weight:500;margin-bottom:2px">Roles</div>
      <div style="font-size:12px;color:#6C6C70;margin-bottom:8px">Check every role they may clock in as. Check exactly one and it is picked automatically.</div>
      <div style="display:flex;flex-direction:column">${box('ee-role',S.config.roles,e.roles)}</div>
    </div>
    <div class="card">
      <div style="font-size:13px;font-weight:500;margin-bottom:2px">Authorised locations</div>
      <div style="font-size:12px;color:#6C6C70;margin-bottom:8px">Check exactly one and they skip the location step entirely when clocking in.</div>
      <div style="display:flex;flex-direction:column">${box('ee-loc',S.config.locations,e.locations)}</div>
    </div>
    <button class="btn btn-green" onclick="saveEmpEditor()">${e.isNew?'Add employee':'Save changes'}</button>
    <button class="btn btn-ghost" onclick="closeEditor()">Cancel</button>
  </div>`;
}

async function saveEmpEditor(){
  const e=S.editEmp;
  const name=(document.getElementById('ee-name').value||'').trim();
  const code=(document.getElementById('ee-code').value||'').replace(/\D/g,'');
  const roles=[...document.querySelectorAll('.ee-role:checked')].map(c=>c.value);
  const locations=[...document.querySelectorAll('.ee-loc:checked')].map(c=>c.value);
  if(!name){showToast('⚠️ Name is required');return}
  if(code&&code.length!==6){showToast('⚠️ Code must be exactly 6 digits');return}
  if(S.roster.some(x=>x.id!==e.id&&x.name.toLowerCase()===name.toLowerCase())){showToast('⚠️ Another employee already has that name');return}
  if(code&&S.roster.some(x=>x.id!==e.id&&x.code===code)){showToast('⚠️ Another employee already uses that code');return}
  if(!roles.length){showToast('⚠️ Assign at least one role');return}
  if(!locations.length){showToast('⚠️ Assign at least one location');return}
  const ok=await dbSaveEmployee({id:e.id,name,code,roles,locations});
  if(!ok){showToast('⚠️ Save failed — check connection');return}
  showToast(e.isNew?`${name} added ✓`:'Changes saved ✓');
  S.editEmp=null; renderDash();
}

async function removeEmployee(id){
  const e=S.roster.find(x=>x.id===id); if(!e)return;
  const n=S.punches.filter(p=>p.eid===id).length;
  if(!confirm(`Remove ${e.name} from the roster?\n\n${n?`Their ${n} existing time entries stay in the records and reports.`:'They have no time entries.'}\n\nThis cannot be undone.`))return;
  const ok=await dbDeleteEmployee(id);
  showToast(ok?`${e.name} removed ✓`:'⚠️ Delete failed'); renderDash();
}

// ── ROLE EDITOR ──────────────────────────────────────────────
function openRoleEditor(ri){
  const name = ri===null?null:S.config.roles[ri];
  S.editRole = name
    ? {orig:name, name, mode:lunchMode(name)}
    : {orig:null, name:'', mode:'clockout'};
  renderDash();
}

function buildRoleEditor(){
  const r=S.editRole;
  const opt=(val,title,desc)=>`<label class="cl" style="align-items:flex-start;padding:8px 0"><input type="radio" name="rl-mode" value="${val}" ${r.mode===val?'checked':''} style="width:auto;margin:3px 0 0"/><span><span style="font-weight:500">${title}</span><br><span style="font-size:12px;color:#6C6C70">${desc}</span></span></label>`;
  return `<div>
    <div class="card">
      <div style="font-weight:500;font-size:16px;margin-bottom:4px">${r.orig?'Edit role':'Add new role'}</div>
      <label>Role name</label>
      <input id="rl-name" value="${esc(r.name)}" placeholder="Actor" autocomplete="off"/>
    </div>
    <div class="card">
      <div style="font-size:13px;font-weight:500;margin-bottom:2px">Lunch handling</div>
      <div style="font-size:12px;color:#6C6C70;margin-bottom:4px">The 30-minute minimum break applies either way — it is just recorded differently.</div>
      ${opt('button','Take lunch button','One tap logs a 30-minute lunch and deducts it. They stay clocked in.')}
      ${opt('clockout','Clocks out for lunch','They clock out and back in. The 30-minute lockout stops an early return, and a missed break raises an MBP alert at 6+ hours.')}
      ${opt('none','No lunch rule','No lunch button and no missed-break alert. For short or on-call roles.')}
    </div>
    <button class="btn btn-green" onclick="saveRoleEditor()">${r.orig?'Save changes':'Add role'}</button>
    <button class="btn btn-ghost" onclick="closeEditor()">Cancel</button>
  </div>`;
}

async function saveRoleEditor(){
  const r=S.editRole;
  const name=(document.getElementById('rl-name').value||'').trim();
  const mode=(document.querySelector('input[name="rl-mode"]:checked')||{}).value||'none';
  if(!name){showToast('⚠️ Role name is required');return}
  if(S.config.roles.some(x=>x!==r.orig&&x.toLowerCase()===name.toLowerCase())){showToast('⚠️ That role already exists');return}

  const roles = r.orig ? S.config.roles.map(x=>x===r.orig?name:x) : [...S.config.roles,name];
  const rename = v => r.orig ? v.map(x=>x===r.orig?name:x) : v;
  let btn=rename(lunchRoles()).filter(x=>x!==name);
  let co =rename(lunchClockoutRoles()).filter(x=>x!==name);
  if(mode==='button') btn.push(name);
  if(mode==='clockout') co.push(name);

  const ok=await dbSaveConfig({...S.config, roles, lunchRoles:btn.filter(x=>roles.includes(x)), lunchClockoutRoles:co.filter(x=>roles.includes(x))});
  if(!ok){showToast('⚠️ Save failed — check connection');return}
  // Carry a rename through every employee's assigned roles.
  if(r.orig&&r.orig!==name){
    for(const e of S.roster.filter(e=>(e.roles||[]).includes(r.orig)))
      await dbSaveEmployee({...e, roles:e.roles.map(x=>x===r.orig?name:x)});
  }
  showToast(r.orig?'Role saved ✓':`${name} added ✓`);
  S.editRole=null; renderDash();
}

async function removeRole(ri){
  const name=S.config.roles[ri]; if(name===undefined)return;
  const used=S.roster.filter(e=>(e.roles||[]).includes(name));
  if(S.config.roles.length<=1){showToast('⚠️ You need at least one role');return}
  if(!confirm(`Delete the role "${name}"?\n\n${used.length?`It will be removed from ${used.length} employee${used.length===1?'':'s'}.`:'No employees are assigned to it.'}\nPast time entries keep this role name.\n\nThis cannot be undone.`))return;
  const roles=S.config.roles.filter(r=>r!==name);
  const ok=await dbSaveConfig({...S.config, roles, lunchRoles:lunchRoles().filter(r=>r!==name), lunchClockoutRoles:lunchClockoutRoles().filter(r=>r!==name)});
  if(!ok){showToast('⚠️ Delete failed');return}
  for(const e of used) await dbSaveEmployee({...e, roles:e.roles.filter(r=>r!==name)});
  showToast('Role deleted ✓'); renderDash();
}

// ── OTHER SETTINGS ───────────────────────────────────────────
function setDeviceType(t){
  if(t) localStorage.setItem('tc_deviceType',t); else localStorage.removeItem('tc_deviceType');
  showToast(t==='shared'?'Set as shared kiosk ✓':'Set as personal device ✓'); renderDash();
}

async function saveLocations(){
  const locs=(document.getElementById('lt').value||'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(!locs.length){showToast('⚠️ At least one location is required');return}
  if(new Set(locs.map(l=>l.toLowerCase())).size!==locs.length){showToast('⚠️ Duplicate locations');return}
  const ok=await dbSaveConfig({...S.config, locations:locs});
  if(!ok){showToast('⚠️ Save failed');return}
  // Drop any location an employee had that no longer exists.
  for(const e of S.roster.filter(e=>(e.locations||[]).some(l=>!locs.includes(l))))
    await dbSaveEmployee({...e, locations:e.locations.filter(l=>locs.includes(l))});
  showToast('Locations saved ✓'); renderDash();
}

async function savePins(){
  const mp=(document.getElementById('mp').value||'').replace(/\D/g,'');
  const ap=(document.getElementById('ap').value||'').replace(/\D/g,'');
  if(mp.length<4||ap.length<4){showToast('⚠️ PINs must be at least 4 digits');return}
  if(mp===ap){showToast('⚠️ Manager and Admin PINs must differ');return}
  const ok=await dbSaveConfig({...S.config, managerPin:mp, adminPin:ap});
  showToast(ok?'PINs saved ✓':'⚠️ Save failed');
}
// ── EXPORT ────────────────────────────────────────────────────
function exportCSV(mode){
  let punches,title;
  if(mode==='day'){punches=S.punches.filter(p=>p.out&&dateKey(p.in)===S.viewDate);title=`day-${S.viewDate}`}
  else{const ws=weekStart(S.wkOff),wEnd=new Date(ws);wEnd.setDate(wEnd.getDate()+7);punches=S.punches.filter(p=>p.out&&new Date(p.in)>=ws&&new Date(p.in)<wEnd);title=`week-${dateKey(ws.toISOString())}`}
  const roles=S.config.roles,rows=[['Employee','Date','First In','Last Out',...roles,'Lunch Deducted','Net Total','MBP','OT (8+ day)','NCNS','<2hr Notice']];
  const ed={};
  punches.forEach(p=>{const dk=dateKey(p.in),k=`${p.eid}|${dk}`;if(!ed[k])ed[k]={eid:p.eid,name:p.name,date:dk,punches:[],rm:{}};const ms=new Date(p.out)-new Date(p.in);ed[k].punches.push(p);ed[k].rm[p.role]=(ed[k].rm[p.role]||0)+ms});
  Object.values(ed).sort((a,b)=>a.name.localeCompare(b.name)||a.date.localeCompare(b.date)).forEach(d=>{
    const fl=getFlag(d.eid,d.date),tot=Object.values(d.rm).reduce((a,b)=>a+b,0),ded=fl.lunch?30*60*1000:0,net=Math.max(0,tot-ded);
    const sp=[...d.punches].sort((a,b)=>new Date(a.in)-new Date(b.in)),lp=[...d.punches].sort((a,b)=>new Date(b.out)-new Date(a.out));
    const al=dayAlerts(d.eid,d.date);
    rows.push([d.name,d.date,fmtTime(sp[0].in),fmtTime(lp[0].out),...roles.map(r=>d.rm[r]?hoursD(d.rm[r]):''),fl.lunch?'-0.50':'',hoursD(net),al.mbp?'Yes':'',al.ot?'Yes':'',fl.ncns?'Yes':'',fl.short?'Yes':'']);
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`timesheet-${title}.csv`;a.click();
}

// ── INIT ─────────────────────────────────────────────────────
async function init(){
  if(!SUPABASE_URL.startsWith('https://')){
    document.getElementById('splash-msg').textContent='';
    document.getElementById('error-msg').textContent='App not configured yet. Open timeclock.html in a text editor and add your Supabase URL and key at the top of the script.';
    show('error-screen'); return;
  }
  syncOnlineState();
  if(typeof supabase==='undefined'){
    document.getElementById('error-msg').textContent = navigator.onLine
      ? 'Could not load the app. Try again in a moment.'
      : 'You are offline. Connect to wifi or cell service and try again.';
    show('error-screen'); return;
  }
  db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  try {
    await loadAll();
    setupRealtime();
    const savedId=localStorage.getItem('tc_empId');
    if(savedId&&S.roster.find(e=>e.id===savedId)){S.selId=savedId;S.isPersonalDevice=true;openEmp(savedId);}
    else{goHome();}
  } catch(err){
    const [title,msg]=explainDbError(err);
    document.getElementById('error-title').textContent=title;
    document.getElementById('error-msg').textContent=msg;
    const d=document.getElementById('error-detail');
    if(d) d.textContent=(err&&err.message)||String(err);
    show('error-screen');
  }
}

// ── INTERVALS ────────────────────────────────────────────────
setInterval(()=>{
  renderHdr();
  const e=document.getElementById('el-val'); if(e){const a=getActive(S.selId);if(a)e.textContent=elapsed(a.in)}
  const sc=document.querySelector('.screen.on');
  if(sc?.id==='dashboard'&&S.tab==='status') renderDash();
},30000);

// Lets the app be installed to a home screen. The worker serves the page from
// cache only when the network fails, so a new upload always wins.
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));

init();
</script>
